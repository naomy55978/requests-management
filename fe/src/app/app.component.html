<mat-toolbar class="app-toolbar">
  <span class="app-title">ניהול פניות</span>
  <span class="app-spacer"></span>
  @if (auth.displayName(); as name) {
    <button
      mat-button
      type="button"
      class="app-performance"
      aria-controls="performance-panel"
      [attr.aria-expanded]="performanceOpen()"
      (click)="togglePerformance()"
    >
      ביצועים
    </button>
    <span class="app-user">{{ name }}</span>
    <button mat-button type="button" (click)="auth.logout()">התנתקות</button>
  }
</mat-toolbar>

<main class="app-content">
  <router-outlet />

  @if (performanceOpen() && auth.displayName()) {
    <app-performance-panel class="app-performance-panel" />
  }
</main>
