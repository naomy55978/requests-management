<mat-toolbar class="app-toolbar">
  <span class="app-title">ניהול פניות</span>
  @if (auth.displayName(); as name) {
    <nav class="app-nav" aria-label="ניווט ראשי">
      <a mat-button routerLink="/dashboard" routerLinkActive="active" ariaCurrentWhenActive="page">לוח בקרה</a>
      <a mat-button routerLink="/requests" routerLinkActive="active" ariaCurrentWhenActive="page">פניות</a>
    </nav>
    <span class="app-spacer"></span>
    <button
      mat-button
      type="button"
      class="app-performance"
      #performanceButton
      aria-controls="performance-panel"
      [attr.aria-expanded]="performanceOpen()"
      (click)="togglePerformance()"
    >
      ביצועים
    </button>
    <span class="app-user">{{ name }}</span>
    <button mat-button type="button" (click)="auth.logout()">התנתקות</button>
  } @else {
    <span class="app-spacer"></span>
  }
</mat-toolbar>

<main class="app-content">
  <!-- Above the screen, not below it: below a 20-row table it opened out of sight, and the button seemed to do nothing -->
  @if (performanceOpen() && auth.displayName()) {
    <app-performance-panel class="app-performance-panel" />
  }

  <router-outlet />
</main>
