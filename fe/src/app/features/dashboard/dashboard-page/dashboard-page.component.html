<div class="page-header">
  <h1 class="page-title">לוח בקרה</h1>
  <span class="page-tools">
    <!-- A quiet note: how long the last load took, with cache HIT/MISS (D-23) -->
    <app-timing-badge label="סיכום" [entry]="summaryTiming()" />
    <button mat-icon-button type="button" class="refresh" aria-label="רענן" (click)="summaryStore.refresh()">
      <mat-icon svgIcon="refresh" />
    </button>
  </span>
</div>

<!-- Own loading and error state -->
<app-summary-cards
  [summary]="summaryStore.summary()"
  [loading]="summaryStore.loading()"
  [error]="summaryStore.error()"
  (retry)="summaryStore.refresh()"
/>
