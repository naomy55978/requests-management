<div class="table-scroll" [class.busy]="busy()" [attr.aria-busy]="busy()">
  <table
    mat-table
    matSort
    matSortDisableClear
    class="requests-table"
    [dataSource]="items()"
    [trackBy]="trackById"
    [matSortActive]="sortBy()"
    [matSortDirection]="sortDir()"
    (matSortChange)="onSort($event)"
  >
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>#</th>
      <td mat-cell *matCellDef="let row" class="cell-id">{{ row.id }}</td>
    </ng-container>

    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef mat-sort-header="title">כותרת</th>
      <td mat-cell *matCellDef="let row" [attr.title]="row.title">
        <span class="cell-text cell-title" dir="auto">{{ row.title }}</span>
      </td>
    </ng-container>

    <ng-container matColumnDef="organizationName">
      <th mat-header-cell *matHeaderCellDef>ארגון</th>
      <td mat-cell *matCellDef="let row" [attr.title]="row.organizationName">
        <span class="cell-text" dir="auto">{{ row.organizationName }}</span>
      </td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef mat-sort-header="status">סטטוס</th>
      <td mat-cell *matCellDef="let row"><app-status-chip [status]="row.status" /></td>
    </ng-container>

    <ng-container matColumnDef="priority">
      <th mat-header-cell *matHeaderCellDef mat-sort-header="priority">עדיפות</th>
      <td mat-cell *matCellDef="let row"><app-priority-chip [priority]="row.priority" /></td>
    </ng-container>

    <ng-container matColumnDef="assignedTo">
      <th mat-header-cell *matHeaderCellDef>מטפל</th>
      <td mat-cell *matCellDef="let row">
        @if (row.assignedTo) {
          <span dir="ltr">{{ row.assignedTo }}</span>
        } @else {
          <span class="unassigned">לא משויכת</span>
        }
      </td>
    </ng-container>

    <ng-container matColumnDef="createdAt">
      <th mat-header-cell *matHeaderCellDef mat-sort-header="createdAt">נוצרה</th>
      <td mat-cell *matCellDef="let row" class="cell-date">{{ row.createdAt | date: 'dd/MM/yyyy HH:mm' }}</td>
    </ng-container>

    <ng-container matColumnDef="updatedAt">
      <th mat-header-cell *matHeaderCellDef mat-sort-header="updatedAt">עודכנה</th>
      <td mat-cell *matCellDef="let row" class="cell-date">{{ row.updatedAt | date: 'dd/MM/yyyy HH:mm' }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"></tr>
  </table>
</div>
