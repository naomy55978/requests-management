@if (view(); as badge) {
  <span class="badge" tabindex="0" [matTooltip]="badge.tooltip" [attr.aria-label]="(label() ? label() + ': ' : '') + badge.text + '. ' + badge.tooltip">
    @if (label()) {
      <span class="label">{{ label() }}</span>
    }
    <span class="value" dir="ltr">{{ badge.text }}</span>
    @if (badge.cache) {
      <span class="cache" [attr.data-cache]="badge.cache">{{ badge.cache === 'hit' ? 'HIT' : 'MISS' }}</span>
    }
  </span>
}
