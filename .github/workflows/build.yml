name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # SDK version is pinned in global.json (shared with local development)
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore RequestsManagement.sln

      - name: Build
        run: dotnet build RequestsManagement.sln -c Release --no-restore

      # Tests (including integration tests against a SQL Server service container) are added in M6
